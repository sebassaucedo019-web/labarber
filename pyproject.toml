[project]
name = "agente-whatsapp"
version = "0.1.0"
description = "Template para arrancar un bot de WhatsApp con IA sobre Meta Cloud API (AIPaths)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pywa>=4.4",
  "pydantic-ai-slim[openai]>=1.0",
  "pydantic-settings>=2.6",
  "redis>=5.2",
  "rq>=2.0",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
]

[project.optional-dependencies]
audio = ["groq>=0.11"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "fakeredis>=2.26",
  "ruff>=0.7",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
